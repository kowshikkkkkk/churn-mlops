name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          TEST_RAW_DATA_PATH: tests/fixtures/churn_data_ci.csv
        run: pytest tests/test_pipeline.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API serving image
        run: docker build -t churn-mlops-api:ci -f Dockerfile .

      - name: Build MLflow server image
        run: docker build -t churn-mlops-mlflow:ci -f Dockerfile.mlflow .
